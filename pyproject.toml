[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-agent-ru-messengers"
version = "0.1.0"
description = "Unofficial Hermes Agent platform plugins for MAX and VK"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "dimasalmin and contributors" }]
keywords = ["hermes-agent", "telegram-alternative", "vk", "max-messenger", "russia"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "PyYAML>=6.0",
    "httpx>=0.27",
    "Pillow>=10.0",
    "pillow-heif>=0.18",
]

[project.optional-dependencies]
vk = ["httpx>=0.27"]
all = ["httpx>=0.27"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-mock>=3"]
webhook = ["uvicorn>=0.30"]

[tool.setuptools.packages.find]
where = ["."]
include = ["plugins*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

name: MAX and VK plugins

on:
  push:
    paths:
      - "plugins/max/**"
      - "plugins/vk/**"
      - "plugins/_ru_common/**"
      - "tests/test_max_*.py"
      - "tests/test_vk_*.py"
      - "tests/test_common.py"
      - "tests/conftest.py"
      - "scripts/max_*.py"
      - "scripts/vk_*.py"
      - "pyproject.toml"
      - "README.md"
      - "docs/ru/max-setup.md"
      - "docs/project-status.md"
      - ".github/workflows/vk-plugin.yml"
  pull_request:
    paths:
      - "plugins/max/**"
      - "plugins/vk/**"
      - "plugins/_ru_common/**"
      - "tests/test_max_*.py"
      - "tests/test_vk_*.py"
      - "tests/test_common.py"
      - "tests/conftest.py"
      - "scripts/max_*.py"
      - "scripts/vk_*.py"
      - "pyproject.toml"
      - "README.md"
      - "docs/ru/max-setup.md"
      - "docs/project-status.md"
      - ".github/workflows/vk-plugin.yml"

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile MAX and VK plugins and tests
        run: python -m compileall -q plugins/max plugins/vk plugins/_ru_common tests scripts
      - name: Run MAX and VK regression suite
        run: python -m pytest -q

  hermes-contract:
    name: Hermes ${{ matrix.hermes }} MAX contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - hermes: "0.21.4"
            ref: "d337b736aa1e8ebecfab043842d13e4a2d2f48a3"
            directory: hermes-0.21.4
          - hermes: "v2026.9.24"
            ref: "f97608f178d1ffeca59860195ab7da295f7c8e5f"
            directory: hermes-stable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.ref }}
          path: .contract/${{ matrix.directory }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install MAX plugin and pinned Hermes runtime
        run: python -m pip install -e ".[dev]"
      - name: Install pinned Hermes package
        run: python -m pip install -e "$HERMES_ROOT"
        env:
          HERMES_ROOT: ${{ github.workspace }}/.contract/${{ matrix.directory }}
      - name: Run MAX loader and native-contract smoke
        run: |
          python scripts/max_loader_smoke.py --hermes-root "$HERMES_ROOT"
          python scripts/max_failover_contract.py --hermes-root "$HERMES_ROOT"
          python scripts/max_failover_contract.py --hermes-root "$HERMES_ROOT" --auto-return
          python scripts/max_busy_contract.py --hermes-root "$HERMES_ROOT"
        env:
          HERMES_ROOT: ${{ github.workspace }}/.contract/${{ matrix.directory }}
